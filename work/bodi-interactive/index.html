<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<title>BODcast Live Class — Interactive Prototype</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: transparent;
    color: #fff;
    overflow: hidden;
  }
  button, input { font: inherit; }
  button { border: 0; cursor: pointer; color: inherit; background: transparent; }

  /* ============================================================
     DEMO SHELL  (chrome that is NOT part of the product)
     ============================================================ */
  .demo-shell {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  .demo-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px 20px;
    padding: 14px clamp(16px, 3vw, 34px);
    background: transparent;
  }

  /* Phase scrubber */
  .scrubber { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .step {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 34px;
    padding: 0 16px 0 13px;
    border-radius: 999px;
    color: rgba(0,0,0,.5);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    transition: color .18s ease, background .18s ease;
  }
  .step .dot {
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(0,0,0,.08);
    font-size: 10px;
    color: rgba(0,0,0,.55);
  }
  .step:hover { color: #111; }
  .step.active { background: rgba(47,155,255,.16); color: #0b3a66; }
  .step.active .dot { background: #2f9bff; color: #fff; }
  .step.done .dot { background: rgba(47,155,255,.4); color: #fff; }
  .step-sep { width: 14px; height: 1px; background: rgba(0,0,0,.16); }

  /* Spotlight chips (only relevant during the live phase) */
  .spotlights {
    display: none;
    align-items: center;
    gap: 8px;
    margin-left: 4px;
    padding-left: 12px;
    border-left: 1px solid rgba(0,0,0,.12);
  }
  .demo-shell[data-phase="live"] .spotlights { display: inline-flex; }
  .chip {
    height: 30px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid rgba(0,0,0,.2);
    color: rgba(0,0,0,.7);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    transition: border-color .18s ease, color .18s ease, background .18s ease;
  }
  .chip:hover { color: #0b3a66; border-color: #2f9bff; background: rgba(47,155,255,.12); }

  /* Device toggle */
  .device-toggle {
    display: inline-flex;
    padding: 4px;
    border-radius: 999px;
    background: rgba(0,0,0,.06);
  }
  .device-toggle button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    padding: 0 14px;
    border-radius: 999px;
    color: rgba(0,0,0,.55);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    transition: color .18s ease, background .18s ease;
  }
  .device-toggle button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .device-toggle button.active { background: #14161a; color: #fff; }

  /* ============================================================
     DEVICE STAGE  (centers and scales the bezel)
     ============================================================ */
  .device-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: clamp(18px, 3vw, 40px);
  }
  .device {
    position: relative;
    transform: scale(var(--scale, 1));
    transform-origin: center center;
    transition: width .35s ease, height .35s ease;
  }
  .device-screen {
    position: relative;
    width: var(--dw);
    height: var(--dh);
    overflow: hidden;
    background: #000;
    border-radius: var(--screen-radius, 10px);
    box-shadow: var(--bezel);
  }
  /* Desktop = laptop-ish thin frame */
  .device[data-device="desktop"] {
    --dw: 1280px; --dh: 720px; --screen-radius: 12px;
    --bezel: 0 0 0 10px #15171b, 0 0 0 12px rgba(255,255,255,.06), 0 40px 90px rgba(0,0,0,.5);
  }
  .device[data-device="desktop"]::after {
    content: ""; position: absolute;
    left: 50%; bottom: -26px; transform: translateX(-50%);
    width: 1440px; height: 18px; border-radius: 0 0 14px 14px;
    background: linear-gradient(#1c1f24, #101216);
    box-shadow: 0 16px 30px rgba(0,0,0,.5);
  }
  /* Tablet = landscape, chunkier frame */
  .device[data-device="tablet"] {
    --dw: 1024px; --dh: 768px; --screen-radius: 8px;
    --bezel: 0 0 0 26px #15171b, 0 0 0 28px rgba(255,255,255,.05), 0 40px 90px rgba(0,0,0,.5);
  }
  /* Mobile = landscape phone */
  .device[data-device="mobile"] {
    --dw: 896px; --dh: 414px; --screen-radius: 34px;
    --bezel: 0 0 0 12px #14161a, 0 0 0 14px rgba(255,255,255,.06), 0 30px 70px rgba(0,0,0,.5);
  }
  .device[data-device="mobile"] .device-screen::before {
    content: ""; position: absolute;
    left: 10px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 120px; border-radius: 999px;
    background: #0a0b0d; z-index: 50;
  }

  /* ============================================================
     BODi PRODUCT  (lives inside the screen)
     ============================================================ */
  .bodi-cast {
    position: absolute;
    inset: 0;
    isolation: isolate;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 21%, rgba(255,255,255,.95) 0 14%, rgba(255,255,255,.82) 25%, rgba(255,255,255,.08) 48%, rgba(0,0,0,.62) 78%),
      linear-gradient(180deg, #555 0%, #d7d7d7 28%, #9d9d9d 54%, #333 100%);
  }
  .bodi-cast::before {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(0,0,0,.44), transparent 18%, transparent 73%, rgba(0,0,0,.25)),
      linear-gradient(180deg, rgba(0,0,0,.42), transparent 24%, transparent 66%, rgba(0,0,0,.52));
    z-index: 0; pointer-events: none;
  }

  /* Phases: only the active one shows */
  .phase { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .4s ease; z-index: 1; }
  .bodi-cast[data-phase="precast"] .phase[data-phase="precast"],
  .bodi-cast[data-phase="live"]    .phase[data-phase="live"] { opacity: 1; visibility: visible; }
  .leave-btn { display: none; } /* chrome is provided per-phase (SVG / image) */

  /* Pre-class: image first, then countdown takes over before going live */
  .phase[data-phase="precast"] .countdown { display: none; }
  .phase[data-phase="precast"].counting .countdown { display: grid; }
  .phase[data-phase="precast"].counting .precast-screen { display: none; }

  /* Shared chrome */
  .leave-btn {
    position: absolute;
    top: clamp(16px, 2.4vw, 24px);
    left: clamp(16px, 2.4vw, 24px);
    height: 40px;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 0 21px;
    border-radius: 999px;
    background: rgba(25,27,30,.9);
    color: #f2f2f2;
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    box-shadow: 0 10px 26px rgba(0,0,0,.22);
    z-index: 30;
    transition: transform .18s ease, background .18s ease;
  }
  .leave-btn:hover { transform: translateY(-1px); background: rgba(14,16,18,.96); }
  .x-icon { width: 18px; height: 18px; position: relative; opacity: .65; }
  .x-icon::before, .x-icon::after {
    content: ""; position: absolute; top: 8px; left: 0;
    width: 19px; height: 2px; border-radius: 1px; background: currentColor;
  }
  .x-icon::before { transform: rotate(45deg); }
  .x-icon::after { transform: rotate(-45deg); }

  /* ---- Self-view casting camera (shared lobby + live) ---- */
  .camera-card {
    position: absolute;
    top: clamp(16px, 2.4vw, 21px);
    right: clamp(16px, 2.4vw, 31px);
    width: min(340px, 31%);
    aspect-ratio: 340 / 255;
    border-radius: 7px;
    overflow: hidden;
    background: #1c1e22;
    box-shadow: 0 18px 42px rgba(0,0,0,.22);
    z-index: 25;
    transition: width .32s ease, transform .32s ease;
  }
  .camera-card.expanded { width: min(520px, calc(100% - 40px)); transform: translateY(7px); }
  .camera-card img, .camera-card video {
    width: 100%; height: 100%; object-fit: cover; filter: saturate(.98) contrast(.96);
  }
  .camera-shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.42));
    pointer-events: none;
  }
  .camera-label {
    position: absolute; left: 15px; bottom: 16px;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
  }
  .camera-label::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: #2498ff; box-shadow: 0 0 0 3px rgba(36,152,255,.2);
  }
  /* Not-streaming state */
  .camera-card.off img, .camera-card.off .camera-shade { display: none; }
  .camera-card.off { display: grid; place-items: center; text-align: center; }
  .camera-card .off-msg { display: none; }
  .camera-card.off .off-msg {
    display: grid; gap: 8px; justify-items: center;
    color: rgba(255,255,255,.78); font-size: 13px; font-weight: 600;
  }
  .camera-card.off .camera-label { display: none; }
  .off-msg svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  .more-btn {
    position: absolute; right: 13px; bottom: 13px;
    width: 25px; height: 25px; border-radius: 50%;
    background: rgba(0,0,0,.25); z-index: 2;
  }
  .more-btn::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 3px; height: 15px;
    background:
      radial-gradient(circle, #fff 50%, transparent 55%) 50% 0 / 3px 3px no-repeat,
      radial-gradient(circle, #fff 50%, transparent 55%) 50% 50% / 3px 3px no-repeat,
      radial-gradient(circle, #fff 50%, transparent 55%) 50% 100% / 3px 3px no-repeat;
  }
  /* Camera context menu */
  .cam-menu {
    position: absolute; right: 13px; bottom: 44px;
    width: 168px; padding: 6px;
    border-radius: 8px;
    background: rgba(20,22,26,.97);
    box-shadow: 0 14px 34px rgba(0,0,0,.4);
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 3;
  }
  .cam-menu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .cam-menu button {
    display: block; width: 100%; text-align: left;
    padding: 9px 12px; border-radius: 6px;
    font-size: 12.5px; color: rgba(255,255,255,.9);
  }
  .cam-menu button:hover { background: rgba(255,255,255,.08); }

  /* Highlight pulse used by spotlight chips */
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(47,155,255,.55), 0 18px 42px rgba(0,0,0,.22); }
    100% { box-shadow: 0 0 0 14px rgba(47,155,255,0), 0 18px 42px rgba(0,0,0,.22); }
  }
  .spotlight { animation: pulse-ring 1.1s ease-out 2; }

  /* ============================================================
     PHASE: RULES (onboarding modal)
     ============================================================ */
  .phase[data-phase="rules"] {
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.78));
    display: grid; place-items: center;
  }
  .rules-modal {
    width: min(720px, calc(100% - 48px));
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(22,24,28,.98);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .rules-left {
    padding: 34px 28px;
    background: linear-gradient(160deg, rgba(47,155,255,.12), rgba(0,0,0,.2)), #16181c;
    display: grid; align-content: center; gap: 24px;
  }
  .rule { display: grid; grid-template-columns: 14px 1fr; gap: 12px; }
  .rule::before {
    content: ""; width: 10px; height: 10px; margin-top: 5px;
    border-radius: 50%; background: #2f9bff;
  }
  .rule h4 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .rule p { margin: 0; font-size: 12px; line-height: 1.45; color: rgba(255,255,255,.6); }
  .rules-right { position: relative; padding: 30px 26px 22px; display: grid; grid-template-rows: auto 1fr auto; }
  .rules-right h3 { margin: 0 0 14px; font-size: 22px; font-weight: 600; }
  .rules-body { overflow: auto; font-size: 12px; line-height: 1.6; color: rgba(255,255,255,.62); padding-right: 6px; }
  .rules-body p { margin: 0 0 12px; }
  .rules-foot { margin-top: 16px; display: grid; gap: 14px; }
  .agree-row { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: rgba(255,255,255,.78); }
  .agree-row input { margin-top: 2px; accent-color: #2f9bff; width: 16px; height: 16px; }
  .rules-actions { display: flex; align-items: center; justify-content: flex-end; gap: 18px; }
  .btn-text { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: #2f9bff; padding: 8px 4px; }
  .btn-primary {
    height: 40px; padding: 0 26px; border-radius: 999px;
    background: #2f9bff; color: #08121d; font-size: 13px; font-weight: 600; letter-spacing: .04em;
    transition: filter .18s ease, transform .18s ease;
  }
  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .modal-close {
    position: absolute; right: 16px; top: 14px; width: 22px; height: 22px; color: rgba(255,255,255,.6);
  }
  .modal-close::before, .modal-close::after {
    content: ""; position: absolute; top: 10px; left: 4px; width: 14px; height: 1.5px; background: currentColor;
  }
  .modal-close::before { transform: rotate(45deg); }
  .modal-close::after { transform: rotate(-45deg); }

  /* ============================================================
     PHASE: PRECAST (camera tips before the countdown)
     ============================================================ */
  .phase[data-phase="precast"] { background: #000; }
  .precast-screen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .precast-foot { position: absolute; left: clamp(20px, 2.4vw, 30px); bottom: clamp(16px, 4%, 36px); z-index: 5; }
  .precast-foot .lobby-logo { font-size: clamp(16px, 1.8vw, 24px); }
  .till-class { font-size: clamp(18px, 2.2vw, 30px); font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.5); }

  /* Pre-class scales down on the (landscape) phone */
  .device[data-device="mobile"] .till-class { font-size: 16px; }
  .device[data-device="mobile"] .precast-foot .lobby-logo { font-size: 14px; }

  /* ============================================================
     PHASE: LOBBY (class starting soon + countdown)
     ============================================================ */
  .phase[data-phase="lobby"] {
    background:
      radial-gradient(circle at 50% 42%, rgba(47,120,255,.32), transparent 55%),
      radial-gradient(circle at 50% 42%, rgba(120,60,255,.22), transparent 60%),
      linear-gradient(180deg, #05070d 0%, #0a0f1d 45%, #05070d 100%);
  }
  .countdown {
    position: absolute; inset: 0;
    display: grid; place-content: center; justify-items: center; gap: 4px;
    text-align: center;
  }
  .countdown .num {
    font-size: clamp(120px, 22vw, 240px);
    font-weight: 600; line-height: .9;
    color: #fff;
    text-shadow: 0 0 40px rgba(70,150,255,.7), 0 0 90px rgba(70,150,255,.45);
  }
  .countdown .num.flash { animation: flash .5s ease; }
  @keyframes flash { 0% { transform: scale(1.18); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
  .lobby-info { position: absolute; left: clamp(20px, 2.4vw, 24px); bottom: clamp(80px, 12%, 96px); }
  .lobby-logo {
    font-size: 22px; font-weight: 600; letter-spacing: .02em; color: #2f9bff; margin-bottom: 6px;
  }
  .lobby-info h2 { margin: 0 0 8px; font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; }

  /* ============================================================
     PHASE: LIVE (SVG layout over looping workout video)
     ============================================================ */
  .phase[data-phase="live"] { background: #000; }
  .live-clip { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .live-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .live-scrim {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.2), transparent 22%, transparent 55%, rgba(0,0,0,.5));
  }

  /* ---- Desktop: flat SVG layout over a 16:9 stage, 16px top/bottom frame ---- */
  .device[data-device="desktop"] .phase[data-phase="live"] { padding: 16px 0; }
  .live-for-desktop { position: relative; width: 100%; aspect-ratio: 16 / 9; display: none; }
  .device[data-device="desktop"] .live-for-desktop { display: block; }
  .live-ui-desktop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; pointer-events: none; }
  .camera-card.live-cast {
    top: 3.19%; left: 71.41%; right: auto; bottom: auto;
    width: 26.72%; height: 35.56%; aspect-ratio: auto; border-radius: 14px; z-index: 3;
  }

  /* ---- Mobile / tablet: independent HTML parts, 16px from every edge ---- */
  .live-for-mobile { position: absolute; inset: 0; display: none; z-index: 2; }
  .device[data-device="tablet"] .live-for-mobile,
  .device[data-device="mobile"] .live-for-mobile { display: block; }
  .live-for-mobile > * { z-index: 5; }
  .live-for-mobile .live-bg, .live-for-mobile .live-scrim { z-index: 0; }
  .live-for-mobile .live-scrim { z-index: 1; }

  .m-leave {
    position: absolute; top: 16px; left: 16px; height: 30px;
    display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
    border-radius: 999px; background: rgba(22,24,25,.82); color: #f2f2f2;
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
  }
  .m-leave .x-icon { width: 12px; height: 12px; opacity: .7; }
  .m-leave .x-icon::before, .m-leave .x-icon::after { width: 13px; top: 5px; }

  .m-music {
    position: absolute; top: 58px; left: 16px; max-width: 220px;
    display: flex; align-items: center; gap: 11px; padding: 10px 14px;
    border-radius: 6px; background: rgba(22,24,25,.8);
  }
  .m-note { font-size: 18px; line-height: 1; opacity: .9; }
  .m-music-title { font-size: 13px; font-weight: 700; }
  .m-music-artist { font-size: 11px; color: rgba(255,255,255,.82); margin-top: 2px; }
  .m-music-src { font-size: 9px; font-style: italic; color: rgba(255,255,255,.5); margin-top: 3px; }

  .camera-card.m-cast {
    top: 16px; right: 16px; left: auto; bottom: auto;
    width: 26%; height: auto; aspect-ratio: 190 / 131; border-radius: 10px; z-index: 5;
  }

  .m-class { position: absolute; left: 16px; bottom: 54px; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
  .m-class h3 { margin: 0 0 3px; font-size: 18px; font-weight: 700; }
  .m-class p { margin: 0; font-size: 12px; line-height: 1.4; color: rgba(255,255,255,.92); }

  .m-controls { position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 16px; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .m-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .m-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #2498ff; box-shadow: 0 0 0 2px rgba(36,152,255,.18); }
  .m-time { font-size: 13px; font-weight: 600; }
  .m-ic { width: 22px; height: 22px; display: grid; place-items: center; color: rgba(255,255,255,.92); }
  .m-ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- legacy live grid (unused, kept harmless) ---- */
  .grid {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
    padding: 3px;
  }
  .tile { position: relative; overflow: hidden; background: #14171c; border-radius: 2px; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile .name {
    position: absolute; left: 8px; bottom: 7px;
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    text-shadow: 0 1px 6px rgba(0,0,0,.7);
  }
  /* Trainer spotlight spans the center */
  .tile.trainer { grid-column: 2 / 4; grid-row: 1 / 3; }
  .tile.trainer .name { font-size: 14px; }
  .grid-shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 20%, transparent 60%, rgba(0,0,0,.6) 100%);
  }

  .music-card {
    position: absolute; top: clamp(96px, 14%, 120px); left: 0;
    width: min(270px, 60%); min-height: 91px;
    display: grid; grid-template-columns: 1fr 42px; align-items: center; gap: 8px;
    padding: 18px 10px 14px 28px;
    border-radius: 0 7px 7px 0;
    background: rgba(35,38,42,.86);
    box-shadow: 0 12px 36px rgba(0,0,0,.18);
    z-index: 20;
    transform: translateX(0);
    transition: transform .28s ease, opacity .28s ease;
  }
  .music-card.hidden { transform: translateX(calc(-100% + 16px)); opacity: .55; }
  .song-title { max-width: 185px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 600; }
  .song-artist { max-width: 178px; margin-top: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: rgba(255,255,255,.86); }
  .feedfm { margin-top: 6px; font-size: 10px; font-style: italic; color: rgba(255,255,255,.56); }
  .music-toggle { width: 29px; height: 29px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
  .play-mark { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 10px solid rgba(10,12,14,.92); margin-left: 2px; }
  .music-toggle.playing .play-mark { width: 10px; height: 13px; border: 0; border-left: 4px solid rgba(10,12,14,.92); border-right: 4px solid rgba(10,12,14,.92); margin-left: 0; }

  .class-info { position: absolute; left: clamp(20px, 2.4vw, 24px); bottom: clamp(80px, 12%, 96px); max-width: 320px; text-shadow: 0 2px 13px rgba(0,0,0,.38); z-index: 15; }
  .attendees { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 13px; color: rgba(255,255,255,.88); }
  .person-icon { width: 15px; height: 15px; display: inline-block; position: relative; }
  .person-icon::before { content: ""; position: absolute; top: 1px; left: 5px; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .person-icon::after { content: ""; position: absolute; left: 2px; bottom: 0; width: 11px; height: 7px; border-radius: 8px 8px 2px 2px; background: #fff; }
  .class-title { margin: 0 0 2px; font-size: clamp(20px, 2.4vw, 22px); line-height: 1.05; font-weight: 600; }
  .trainer-line, .class-meta { margin: 0; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.96); }

  .announcement {
    position: absolute; right: clamp(20px, 2.6vw, 31px); bottom: clamp(80px, 12%, 89px);
    width: min(340px, calc(100% - 40px)); min-height: 104px;
    padding: 25px 42px 20px 24px;
    border-radius: 4px;
    background: rgba(248,248,250,.96); color: #1e1e1e;
    box-shadow: 0 18px 46px rgba(0,0,0,.2);
    z-index: 20;
    transition: transform .24s ease, opacity .24s ease;
  }
  .announcement.closed { transform: translateY(12px); opacity: 0; pointer-events: none; }
  .announcement strong { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 600; }
  .announcement p { margin: 0; font-size: 12px; line-height: 1.35; }
  .close-note { position: absolute; right: 13px; top: 12px; width: 18px; height: 18px; color: #777; }
  .close-note::before, .close-note::after { content: ""; position: absolute; top: 8px; left: 3px; width: 10px; height: 1px; background: currentColor; }
  .close-note::before { transform: rotate(45deg); }
  .close-note::after { transform: rotate(-45deg); }

  .player-bar { position: absolute; left: clamp(20px, 2.4vw, 24px); right: clamp(20px, 2.4vw, 31px); bottom: clamp(16px, 3%, 24px); z-index: 20; }
  .timeline { position: relative; height: 5px; border-radius: 999px; background: rgba(255,255,255,.23); overflow: hidden; }
  .timeline-progress { width: var(--progress, 73%); height: 100%; border-radius: inherit; background: #2f9bff; transition: width .2s linear; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 20px; }
  .left-controls, .right-controls { display: flex; align-items: center; gap: 20px; }
  .live-time { display: flex; align-items: center; gap: 18px; font-size: 14px; font-weight: 600; }
  .live { position: relative; padding-left: 9px; }
  .live::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 3px; transform: translateY(-50%); border-radius: 50%; background: #2498ff; box-shadow: 0 0 0 2px rgba(36,152,255,.16); }
  .volume {
    min-width: 213px; height: 41px;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    border: 1px solid rgba(255,255,255,.86); border-radius: 999px;
    background: rgba(70,70,70,.18);
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    transition: width .2s ease, background .2s ease;
  }
  .volume:hover { background: rgba(255,255,255,.12); }
  .volume svg { width: 17px; height: 17px; }
  .volume input { width: 0; opacity: 0; accent-color: #fff; transition: width .2s ease, opacity .2s ease; }
  .volume.open input, .volume:hover input { width: 82px; opacity: 1; }
  .icon-btn { width: 24px; height: 24px; display: grid; place-items: center; color: rgba(255,255,255,.6); transition: color .18s ease, transform .18s ease; }
  .icon-btn:hover { color: #fff; transform: translateY(-1px); }
  .icon-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ============================================================
     PHASE: POST (placeholder — awaiting final screen)
     ============================================================ */
  .phase[data-phase="post"] {
    background:
      radial-gradient(circle at 50% 35%, rgba(47,155,255,.25), transparent 55%),
      linear-gradient(180deg, #05070d, #0a0f1d 60%, #05070d);
    display: grid; place-items: center; text-align: center;
  }
  .post-card { max-width: 460px; padding: 0 24px; display: grid; gap: 14px; justify-items: center; }
  .post-card .badge {
    width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(47,155,255,.16); color: #2f9bff;
  }
  .post-card .badge svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2; }
  .post-card h2 { margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 600; }
  .post-card p { margin: 0; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.6); }
  .post-stats { display: flex; gap: 26px; margin-top: 8px; }
  .post-stats div { display: grid; gap: 2px; }
  .post-stats .v { font-size: 24px; font-weight: 600; }
  .post-stats .k { font-size: 11px; letter-spacing: .06em; color: rgba(255,255,255,.5); }
  .post-note {
    margin-top: 10px; padding: 8px 14px; border-radius: 8px;
    border: 1px dashed rgba(255,255,255,.2);
    font-size: 12px; color: rgba(255,255,255,.5);
  }

  /* Toast */
  .toast {
    position: absolute; left: 50%; bottom: 92px; transform: translate(-50%, 16px);
    padding: 10px 14px; border-radius: 999px;
    background: rgba(22,24,26,.84); color: rgba(255,255,255,.94); font-size: 13px;
    opacity: 0; pointer-events: none; z-index: 60;
    transition: transform .2s ease, opacity .2s ease;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* ---- Per-device layout tweaks (driven by toggle, not viewport) ---- */
  /* Landscape phone keeps the full live layout, just a touch tighter */
  .device[data-device="mobile"] .camera-card { width: 28%; }
  .device[data-device="mobile"] .grid { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
  .device[data-device="mobile"] .tile:nth-child(n+11) { display: none; }

  .device[data-device="tablet"] .camera-card { width: 34%; }
</style>
</head>
<body>
<div class="demo-shell" data-phase="precast">
  <!-- ===================== DEMO TOOLBAR (chrome) ===================== -->
  <div class="demo-toolbar">
    <nav class="scrubber" aria-label="Prototype phases">
      <button class="step" data-go="precast"><span class="dot">1</span>Pre-class</button>
      <span class="step-sep"></span>
      <button class="step" data-go="live"><span class="dot">2</span>Live class</button>
    </nav>

    <div class="device-toggle" role="group" aria-label="Device">
      <button data-device-btn="desktop" class="active">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Desktop
      </button>
      <button data-device-btn="tablet">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M11 18h2"/></svg>Tablet
      </button>
      <button data-device-btn="mobile">
        <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Mobile
      </button>
    </div>
  </div>

  <!-- ===================== DEVICE STAGE ===================== -->
  <div class="device-stage">
    <div class="device" data-device="desktop">
      <div class="device-screen" data-device="desktop">
        <main class="bodi-cast" data-phase="precast" aria-label="BODi live workout class">

          <!-- ============ PHASE 1: PRECAST (camera tips -> countdown) ============ -->
          <section class="phase" data-phase="precast">
            <img class="precast-screen" src="/assets/work/bodi-interactive/preclass screen.png" alt="BODcast pre-class: camera tips">
            <div class="countdown"><div class="num" data-countdown>5</div></div>

            <section class="camera-card" aria-label="Casting camera">
              <video src="/assets/work/bodi-interactive/precast_self cast.mp4" autoplay muted loop playsinline preload="auto"></video>
              <div class="camera-shade"></div>
              <div class="camera-label">CASTING</div>
              <button class="more-btn" type="button" aria-label="Camera options" data-action="cam-menu"></button>
            </section>

            <div class="precast-foot">
              <div class="lobby-logo">BODi</div>
              <div class="till-class" data-till>13m 37s till class</div>
            </div>
          </section>

          <!-- ============ PHASE 2: LIVE ============ -->
          <section class="phase" data-phase="live">
            <div class="live-clip">

              <!-- DESKTOP: flat SVG layout over a 16:9 video stage -->
              <div class="live-stage live-for-desktop">
                <video class="live-bg" src="/assets/work/bodi-interactive/Lunge.mp4" autoplay muted loop playsinline preload="auto"></video>
                <div class="live-scrim"></div>
                <img class="live-ui live-ui-desktop" src="/assets/work/bodi-interactive/layout/desktop.svg" alt="Live class UI">
                <section class="camera-card live-cast" aria-label="Casting camera">
                  <video src="/assets/work/bodi-interactive/lunge-cast.mp4" autoplay muted loop playsinline preload="auto"></video>
                  <div class="camera-shade"></div>
                  <div class="camera-label">CASTING</div>
                  <button class="more-btn" type="button" aria-label="Camera options" data-action="cam-menu"></button>
                </section>
              </div>

              <!-- MOBILE / TABLET: independent UI parts, 16px from every edge -->
              <div class="live-for-mobile">
                <video class="live-bg" src="/assets/work/bodi-interactive/Lunge.mp4" autoplay muted loop playsinline preload="auto"></video>
                <div class="live-scrim"></div>

                <button class="m-leave" type="button"><span class="x-icon" aria-hidden="true"></span><span>LEAVE CLASS</span></button>

                <section class="m-music" aria-label="Music player">
                  <span class="m-note" aria-hidden="true">♪</span>
                  <div>
                    <div class="m-music-title">Blinding Lights</div>
                    <div class="m-music-artist">The Weeknd | After Hours</div>
                    <div class="m-music-src">Powered by Feed.FM</div>
                  </div>
                </section>

                <section class="camera-card m-cast" aria-label="Casting camera">
                  <video src="/assets/work/bodi-interactive/lunge-cast.mp4" autoplay muted loop playsinline preload="auto"></video>
                  <div class="camera-shade"></div>
                  <div class="camera-label">CASTING</div>
                  <button class="more-btn" type="button" aria-label="Camera options" data-action="cam-menu"></button>
                </section>

                <section class="m-class" aria-label="Class details">
                  <h3>Weights Total Body</h3>
                  <p>with Rosie</p>
                  <p>20m | Bootcamp</p>
                </section>

                <div class="m-controls">
                  <span class="m-live"><span class="m-live-dot" aria-hidden="true"></span>LIVE</span>
                  <span class="m-time">11:04</span>
                  <button class="m-ic" type="button" aria-label="Volume"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9.5c1.3 1.5 1.3 3.5 0 5"/><path d="M18.5 7.5c2.5 2.5 2.5 6.5 0 9"/></svg></button>
                  <button class="m-ic" type="button" aria-label="Audio settings"><svg viewBox="0 0 24 24"><path d="M6 4v6M6 14v6M12 4v3M12 11v9M18 4v9M18 17v3"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="9" r="2"/><circle cx="18" cy="15" r="2"/></svg></button>
                </div>
              </div>

            </div>
          </section>

          <div class="toast" role="status" aria-live="polite"></div>
        </main>
      </div>
    </div>
  </div>
</div>

<script>
  const shell = document.querySelector(".demo-shell");
  const cast = document.querySelector(".bodi-cast");
  const device = document.querySelector(".device");
  const stage = document.querySelector(".device-stage");
  const toast = document.querySelector(".toast");
  const steps = document.querySelectorAll(".step");
  const phaseOrder = ["precast", "live"];

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  }

  /* ---------- Device scaling: fit the bezel into the stage ---------- */
  function fitDevice() {
    const screen = device.querySelector(".device-screen");
    const natW = screen.offsetWidth, natH = screen.offsetHeight;
    if (!natW || !natH) return;
    const pad = 80; // breathing room + bezel/stand
    const availW = stage.clientWidth - pad;
    const availH = stage.clientHeight - pad;
    const scale = Math.min(availW / natW, availH / natH, 1.1);
    device.style.setProperty("--scale", scale.toFixed(3));
  }
  window.addEventListener("resize", fitDevice);

  function setDevice(name) {
    device.dataset.device = name;
    device.querySelector(".device-screen").dataset.device = name;
    document.querySelectorAll("[data-device-btn]").forEach(b =>
      b.classList.toggle("active", b.dataset.deviceBtn === name));
    requestAnimationFrame(fitDevice);
  }
  document.querySelectorAll("[data-device-btn]").forEach(b =>
    b.addEventListener("click", () => setDevice(b.dataset.deviceBtn)));

  /* ---------- Phase navigation ---------- */
  function setPhase(name) {
    cast.dataset.phase = name;
    shell.dataset.phase = name;
    const idx = phaseOrder.indexOf(name);
    steps.forEach(s => {
      const sIdx = phaseOrder.indexOf(s.dataset.go);
      s.classList.toggle("active", s.dataset.go === name);
      s.classList.toggle("done", sIdx > -1 && sIdx < idx);
    });
    if (name === "precast") { startTillClass(); playPrecastVideos(); startPrecastSequence(); }
    if (name === "live") playLiveVideos();
    scheduleAuto(name);
  }
  steps.forEach(s => s.addEventListener("click", () => setPhase(s.dataset.go)));
  document.querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => setPhase(el.dataset.go)));

  /* ---------- Auto-cycle: Pre-class -> Live -> Post -> loop ----------
     Pre-class drives itself (image, then countdown, then Live); the other
     phases advance on a timer. Any manual click restarts the cycle. */
  const dwell = { live: 7000 };
  let autoTimer;
  function scheduleAuto(name) {
    clearTimeout(autoTimer);
    if (name === "precast") return; // precast drives itself: image -> countdown -> live
    autoTimer = setTimeout(() => {
      const i = phaseOrder.indexOf(cast.dataset.phase);
      setPhase(phaseOrder[(i + 1) % phaseOrder.length]);
    }, dwell[name] || 5000);
  }

  /* ---------- Force phase videos to play (autoplay can stall in an iframe) ---------- */
  function playVideosIn(phase) {
    cast.querySelectorAll('.phase[data-phase="' + phase + '"] video').forEach(v => {
      v.muted = true;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    });
  }
  function playPrecastVideos() { playVideosIn("precast"); }
  function playLiveVideos() { playVideosIn("live"); }

  /* ---------- Pre-class "till class" timer ---------- */
  let tillTimer;
  function startTillClass() {
    clearInterval(tillTimer);
    const el = cast.querySelector("[data-till]");
    if (!el) return;
    let secs = 13 * 60 + 37;
    const render = () => { el.textContent = Math.floor(secs / 60) + "m " + String(secs % 60).padStart(2, "0") + "s till class"; };
    render();
    tillTimer = setInterval(() => {
      if (cast.dataset.phase !== "precast") { clearInterval(tillTimer); return; }
      if (secs > 0) secs -= 1;
      render();
    }, 1000);
  }

  /* ---------- Pre-class sequence: tips image -> countdown -> Live ---------- */
  const PRECAST_IMAGE_MS = 6000;   // ~6s on the camera-tips image
  let precastTimer, countdownTimer;
  const precastPhase = cast.querySelector('.phase[data-phase="precast"]');
  function startPrecastSequence() {
    clearTimeout(precastTimer);
    clearInterval(countdownTimer);
    precastPhase.classList.remove("counting");
    precastTimer = setTimeout(() => {
      if (cast.dataset.phase !== "precast") return;
      precastPhase.classList.add("counting");
      runCountdown();
    }, PRECAST_IMAGE_MS);
  }
  function runCountdown() {
    clearInterval(countdownTimer);
    const el = cast.querySelector('.phase[data-phase="precast"] [data-countdown]');
    let n = 5;
    const tick = () => { el.textContent = n; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); };
    tick();
    countdownTimer = setInterval(() => {
      n -= 1;
      if (n <= 0) {
        clearInterval(countdownTimer);
        if (cast.dataset.phase === "precast") setPhase("live");
        return;
      }
      tick();
    }, 1000);
  }

  /* ---------- Live timer + attendees ---------- */
  let seconds = 11 * 60 + 4;
  let progressValue = 73;
  const time = cast.querySelector("[data-time]");
  const timeline = cast.querySelector(".timeline");
  const counts = cast.querySelectorAll("[data-count]");
  function formatTime(t) { return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); }
  setInterval(() => {
    if (cast.dataset.phase !== "live") return;
    seconds += 1;
    progressValue = Math.min(98, progressValue + 0.02);
    cast.style.setProperty("--progress", progressValue + "%");
    if (timeline) timeline.setAttribute("aria-valuenow", Math.round(progressValue));
    if (time) time.textContent = formatTime(seconds);
    if (seconds % 9 === 0) {
      const n = (1435 + Math.floor(Math.random()*20)).toLocaleString();
      counts.forEach(c => c.textContent = n);
    }
  }, 1000);

  /* ---------- Interactions (delegated) ---------- */
  cast.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) {
      const card = e.target.closest(".camera-card");
      if (card && !e.target.closest(".cam-menu")) card.classList.toggle("expanded");
      return;
    }

    // close announcement
    if (btn.classList.contains("close-note")) { btn.closest(".announcement").classList.add("closed"); return; }

    // music toggle
    if (btn.classList.contains("music-toggle")) {
      const playing = btn.classList.toggle("playing");
      btn.setAttribute("aria-label", playing ? "Pause music" : "Play music");
      showToast(playing ? "Music on" : "Music paused");
      e.stopPropagation(); return;
    }

    const action = btn.dataset.action;
    if (action === "leave") { showToast("Class minimized"); return; }
    if (action === "captions") { showToast("Captions toggled"); return; }
    if (action === "cast") { showToast("Casting controls opened"); return; }
    if (action === "fullscreen") {
      document.fullscreenElement ? document.exitFullscreen() : device.querySelector(".device-screen").requestFullscreen?.();
      return;
    }
    if (action === "cam-menu") {
      const menu = btn.parentElement.querySelector(".cam-menu");
      if (menu) menu.classList.toggle("open");
      e.stopPropagation(); return;
    }

    // camera context menu actions
    if (btn.dataset.cam === "camera") {
      const card = btn.closest(".camera-card");
      const off = card.classList.toggle("off");
      btn.textContent = off ? "Turn on Camera" : "Turn off Camera";
      showToast(off ? "Camera off — you're not streaming" : "Camera on — casting");
      e.stopPropagation(); return;
    }
    if (btn.dataset.cam === "window") {
      const card = btn.closest(".camera-card");
      card.style.transition = "opacity .25s ease, transform .25s ease";
      const hidden = card.style.opacity === "0";
      card.style.opacity = hidden ? "1" : "0";
      card.style.transform = hidden ? "" : "translateY(-12px)";
      btn.textContent = hidden ? "Hide Window" : "Show Window";
      showToast(hidden ? "Self-view shown" : "Self-view hidden");
      e.stopPropagation(); return;
    }
  });

  // dismiss any open camera menu on outside click
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".camera-card")) cast.querySelectorAll(".cam-menu.open").forEach(m => m.classList.remove("open"));
  });

  // spotlight follows the cursor on the gray product background (live ambiance)
  cast.addEventListener("pointermove", (e) => {
    const r = cast.getBoundingClientRect();
    cast.style.setProperty("--spot-x", ((e.clientX - r.left)/r.width*100) + "%");
    cast.style.setProperty("--spot-y", ((e.clientY - r.top)/r.height*100) + "%");
  });

  /* ---------- Init ---------- */
  setDevice("desktop");
  setPhase("precast");
  window.addEventListener("load", fitDevice);
  fitDevice();
</script>
